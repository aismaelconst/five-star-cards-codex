<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe1cf"/>
      <stop offset="0.55" stop-color="#d36a3b"/>
      <stop offset="1" stop-color="#7b2f15"/>
    </linearGradient>
    <filter id="grit" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="17"/>
      <feColorMatrix type="saturate" values="0.45"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.6"/>
      </feComponentTransfer>
    </filter>
    <pattern id="scrape" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M5 25 L115 55" stroke="#6b2e18" stroke-width="2" opacity="0.35"/>
      <path d="M0 85 L120 110" stroke="#4a1f11" stroke-width="2" opacity="0.3"/>
    </pattern>
    <pattern id="patina" width="140" height="140" patternUnits="userSpaceOnUse">
      <circle cx="22" cy="30" r="7" fill="#2f8f7a" opacity="0.22"/>
      <circle cx="90" cy="38" r="10" fill="#3aa98f" opacity="0.18"/>
      <circle cx="58" cy="88" r="9" fill="#2f8f7a" opacity="0.2"/>
      <path d="M10 110 L130 92" stroke="#2f8f7a" stroke-width="3" opacity="0.18"/>
    </pattern>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a3d20"/>
      <stop offset="1" stop-color="#f3c5a9"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.2" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#fff4ea" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#bg)"/>
  <rect x="10" y="10" width="580" height="780" rx="30" filter="url(#grit)" opacity="0.6"/>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#scrape)" opacity="0.6"/>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#patina)" opacity="0.4"/>
  <rect x="28" y="28" width="544" height="744" rx="24" fill="none" stroke="url(#frame)" stroke-width="6"/>
  <rect x="45" y="45" width="510" height="710" rx="20" fill="none" stroke="#7a3a1c" stroke-width="2" opacity="0.75"/>
  <g transform="translate(300 365)">
    <polygon points="0,-150 40,-45 150,-35 60,35 90,145 0,85 -90,145 -60,35 -150,-35 -40,-45" fill="#ffd9c1" stroke="#8a3d20" stroke-width="6"/>
    <polygon points="0,-110 30,-35 110,-25 45,25 70,105 0,60 -70,105 -45,25 -110,-25 -30,-35" fill="#d16238" opacity="0.9"/>
  </g>
  <rect x="130" y="640" width="340" height="70" rx="16" fill="#2f190f" opacity="0.7"/>
  <text x="300" y="690" text-anchor="middle" font-family="'Times New Roman', serif" font-size="48" fill="#ffe7d3" letter-spacing="6">COPPER</text>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#shine)"/>
</svg>
