<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd3b5"/>
      <stop offset="0.55" stop-color="#b85f2f"/>
      <stop offset="1" stop-color="#5d2410"/>
    </linearGradient>
    <filter id="grit" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="12"/>
      <feColorMatrix type="saturate" values="0.35"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.55"/>
      </feComponentTransfer>
    </filter>
    <pattern id="scrape" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M5 25 L115 55" stroke="#4a2312" stroke-width="2" opacity="0.3"/>
      <path d="M0 85 L120 110" stroke="#3b1c0e" stroke-width="2" opacity="0.25"/>
    </pattern>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b341d"/>
      <stop offset="1" stop-color="#f3c4a5"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#bg)"/>
  <rect x="10" y="10" width="580" height="780" rx="30" filter="url(#grit)" opacity="0.6"/>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#scrape)" opacity="0.6"/>
  <rect x="28" y="28" width="544" height="744" rx="24" fill="none" stroke="url(#frame)" stroke-width="6"/>
  <rect x="45" y="45" width="510" height="710" rx="20" fill="none" stroke="#6a361f" stroke-width="2" opacity="0.75"/>
  <g transform="translate(300 360)">
    <polygon points="0,-150 40,-45 150,-35 60,35 90,145 0,85 -90,145 -60,35 -150,-35 -40,-45" fill="#ffd0b2" stroke="#6a3a22" stroke-width="6"/>
    <polygon points="0,-95 35,-20 95,-10 40,25 60,90 0,55 -60,90 -40,25 -95,-10 -35,-20" fill="#9a4d2b" opacity="0.95"/>
  </g>
  <rect x="120" y="640" width="360" height="70" rx="16" fill="#2a1309" opacity="0.7"/>
  <text x="300" y="690" text-anchor="middle" font-family="'Times New Roman', serif" font-size="48" fill="#ffe0c9" letter-spacing="6">COPPER</text>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#shine)"/>
</svg>
