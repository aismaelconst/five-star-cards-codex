<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe2bf"/>
      <stop offset="0.55" stop-color="#d48a43"/>
      <stop offset="1" stop-color="#7a3b18"/>
    </linearGradient>
    <filter id="grit" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="9"/>
      <feColorMatrix type="saturate" values="0.4"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.55"/>
      </feComponentTransfer>
    </filter>
    <pattern id="hammer" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="28" r="10" fill="#b36b36" opacity="0.25"/>
      <circle cx="80" cy="40" r="8" fill="#9a5a2d" opacity="0.25"/>
      <circle cx="58" cy="86" r="12" fill="#a96534" opacity="0.22"/>
      <circle cx="100" cy="96" r="6" fill="#7a431f" opacity="0.2"/>
    </pattern>
    <pattern id="scrape" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M5 25 L115 55" stroke="#6a3316" stroke-width="2" opacity="0.3"/>
      <path d="M0 85 L120 110" stroke="#5a2b13" stroke-width="2" opacity="0.25"/>
    </pattern>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a4a22"/>
      <stop offset="1" stop-color="#f3cda5"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.2" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#fff3e4" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#bg)"/>
  <rect x="10" y="10" width="580" height="780" rx="30" filter="url(#grit)" opacity="0.6"/>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#scrape)" opacity="0.5"/>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#hammer)" opacity="0.45"/>
  <rect x="28" y="28" width="544" height="744" rx="24" fill="none" stroke="url(#frame)" stroke-width="6"/>
  <rect x="45" y="45" width="510" height="710" rx="20" fill="none" stroke="#7a3a1c" stroke-width="2" opacity="0.75"/>
  <g transform="translate(300 365)">
    <polygon points="0,-150 40,-45 150,-35 60,35 90,145 0,85 -90,145 -60,35 -150,-35 -40,-45" fill="#ffe8cf" stroke="#8a4a22" stroke-width="6"/>
    <polygon points="0,-110 30,-35 110,-25 45,25 70,105 0,60 -70,105 -45,25 -110,-25 -30,-35" fill="#d27a41" opacity="0.9"/>
  </g>
  <rect x="130" y="640" width="340" height="70" rx="16" fill="#2c160a" opacity="0.7"/>
  <text x="300" y="690" text-anchor="middle" font-family="'Times New Roman', serif" font-size="48" fill="#ffe7d3" letter-spacing="6">INGOT</text>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#shine)"/>
</svg>
