<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe7d9"/>
      <stop offset="0.55" stop-color="#d06b3b"/>
      <stop offset="1" stop-color="#612616"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="2" seed="31"/>
      <feColorMatrix type="saturate" values="0.45"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.55"/>
      </feComponentTransfer>
    </filter>
    <pattern id="embers" width="110" height="110" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="5" fill="#ffd3b6" opacity="0.25"/>
      <circle cx="70" cy="40" r="6" fill="#ffc19d" opacity="0.22"/>
