<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e8c8"/>
      <stop offset="0.55" stop-color="#d7bc92"/>
      <stop offset="1" stop-color="#8e6a3f"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="13"/>
      <feColorMatrix type="saturate" values="0.2"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.5"/>
      </feComponentTransfer>
    </filter>
    <pattern id="lines" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M0 24 L120 24" stroke="#b58c5d" stroke-width="2" opacity="0.35"/>
      <path d="M0 54 L120 54" stroke="#a1784e" stroke-width="2" opacity="0.3"/>
      <path d="M0 84 L120 84" stroke="#8f6a43" stroke-width="2" opacity="0.28"/>
    </pattern>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b5a35"/>
      <stop offset="1" stop-color="#f0d9b5"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.18" cy="0.08" r="0.9">
      <stop offset="0" stop-color="#fff7e6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#bg)"/>
  <rect x="10" y="10" width="580" height="780" rx="30" filter="url(#grain)" opacity="0.6"/>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#lines)" opacity="0.6"/>
  <rect x="28" y="28" width="544" height="744" rx="24" fill="none" stroke="url(#frame)" stroke-width="6"/>
  <rect x="45" y="45" width="510" height="710" rx="20" fill="none" stroke="#7b5a35" stroke-width="2" opacity="0.75"/>
  <g transform="translate(300 365)">
    <polygon points="0,-150 40,-45 150,-35 60,35 90,145 0,85 -90,145 -60,35 -150,-35 -40,-45" fill="#f3dfbf" stroke="#7b5a35" stroke-width="6"/>
    <polygon points="0,-110 30,-35 110,-25 45,25 70,105 0,60 -70,105 -45,25 -110,-25 -30,-35" fill="#c9a678" opacity="0.9"/>
  </g>
  <rect x="120" y="640" width="360" height="70" rx="16" fill="#3a2816" opacity="0.6"/>
  <text x="300" y="690" text-anchor="middle" font-family="'Times New Roman', serif" font-size="48" fill="#f7e7cf" letter-spacing="6">LEDGER</text>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#shine)"/>
</svg>
