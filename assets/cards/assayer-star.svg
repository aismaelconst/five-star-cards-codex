    </pattern>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35685e"/>
      <stop offset="1" stop-color="#dbf2e8"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.18" cy="0.08" r="0.88">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#bg)"/>
  <rect x="10" y="10" width="580" height="780" rx="30" filter="url(#grain)" opacity="0.58"/>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#measure)" opacity="0.65"/>
  <rect x="28" y="28" width="544" height="744" rx="24" fill="none" stroke="url(#frame)" stroke-width="6"/>
  <rect x="45" y="45" width="510" height="710" rx="20" fill="none" stroke="#315e56" stroke-width="2" opacity="0.75"/>
  <g transform="translate(300 360)">
    <polygon points="0,-150 40,-45 150,-35 60,35 90,145 0,85 -90,145 -60,35 -150,-35 -40,-45" fill="#e6f6ef" stroke="#35685e" stroke-width="6"/>
    <polygon points="0,-100 34,-24 100,-14 42,22 64,92 0,56 -64,92 -42,22 -100,-14 -34,-24" fill="#6bab95" opacity="0.94"/>
    <circle cx="0" cy="-6" r="18" fill="#f3faf7" stroke="#335f57" stroke-width="5"/>
