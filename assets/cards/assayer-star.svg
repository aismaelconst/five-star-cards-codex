  <rect x="118" y="640" width="364" height="70" rx="16" fill="#17342f" opacity="0.66"/>
  <text x="300" y="689" text-anchor="middle" font-family="'Times New Roman', serif" font-size="46" fill="#ecfaf4" letter-spacing="5">ASSAYER</text>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#shine)"/>
