<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ebfbf4"/>
      <stop offset="0.55" stop-color="#7dbba7"/>
      <stop offset="1" stop-color="#345e55"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="2" seed="17"/>
      <feColorMatrix type="saturate" values="0.4"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.5"/>
      </feComponentTransfer>
    </filter>
    <pattern id="measure" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M16 24 L104 24" stroke="#4b8f7c" stroke-width="3" opacity="0.22"/>
      <path d="M24 56 L96 56" stroke="#3d7b6c" stroke-width="3" opacity="0.2"/>
      <path d="M32 88 L88 88" stroke="#2c6558" stroke-width="3" opacity="0.18"/>
