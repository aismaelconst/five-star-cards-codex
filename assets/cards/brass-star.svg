<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe8b3"/>
      <stop offset="0.55" stop-color="#b9892c"/>
      <stop offset="1" stop-color="#6b4312"/>
    </linearGradient>
    <filter id="grit" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="9"/>
      <feColorMatrix type="saturate" values="0.25"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.55"/>
      </feComponentTransfer>
    </filter>
    <pattern id="scrape" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M5 20 L115 50" stroke="#5a3e12" stroke-width="2" opacity="0.3"/>
      <path d="M0 80 L120 105" stroke="#4a320e" stroke-width="2" opacity="0.25"/>
    </pattern>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a4a18"/>
      <stop offset="1" stop-color="#f3dc9b"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#bg)"/>
  <rect x="10" y="10" width="580" height="780" rx="30" filter="url(#grit)" opacity="0.6"/>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#scrape)" opacity="0.6"/>
  <rect x="28" y="28" width="544" height="744" rx="24" fill="none" stroke="url(#frame)" stroke-width="6"/>
  <rect x="45" y="45" width="510" height="710" rx="20" fill="none" stroke="#6b4b1a" stroke-width="2" opacity="0.75"/>
  <g transform="translate(300 360)">
    <polygon points="0,-150 40,-45 150,-35 60,35 90,145 0,85 -90,145 -60,35 -150,-35 -40,-45" fill="#ffe0a6" stroke="#6a4a1b" stroke-width="6"/>
    <polygon points="0,-95 35,-20 95,-10 40,25 60,90 0,55 -60,90 -40,25 -95,-10 -35,-20" fill="#966e1f" opacity="0.95"/>
  </g>
  <rect x="120" y="640" width="360" height="70" rx="16" fill="#2d210a" opacity="0.7"/>
  <text x="300" y="690" text-anchor="middle" font-family="'Times New Roman', serif" font-size="48" fill="#ffe9b4" letter-spacing="6">BRASS</text>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#shine)"/>
</svg>
