<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2b57b"/>
      <stop offset="0.55" stop-color="#8b4b24"/>
      <stop offset="1" stop-color="#3b1f10"/>
    </linearGradient>
    <pattern id="wood" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="90" height="90" fill="none"/>
      <path d="M0 12 C25 2, 55 2, 90 12" stroke="#6a3a1f" stroke-width="5" fill="none" opacity="0.65"/>
      <path d="M0 36 C20 26, 60 26, 90 36" stroke="#4a2816" stroke-width="4" fill="none" opacity="0.6"/>
      <path d="M0 60 C28 52, 58 52, 90 60" stroke="#7b4a27" stroke-width="3" fill="none" opacity="0.6"/>
      <path d="M0 80 C22 74, 60 74, 90 80" stroke="#3a1e0f" stroke-width="2" fill="none" opacity="0.55"/>
    </pattern>
    <pattern id="rings" width="140" height="140" patternUnits="userSpaceOnUse">
      <circle cx="40" cy="40" r="14" fill="none" stroke="#5a2f18" stroke-width="2" opacity="0.65"/>
      <circle cx="40" cy="40" r="22" fill="none" stroke="#7b4a27" stroke-width="2" opacity="0.5"/>
      <circle cx="100" cy="90" r="12" fill="none" stroke="#5a2f18" stroke-width="2" opacity="0.55"/>
      <circle cx="100" cy="90" r="20" fill="none" stroke="#8a5a31" stroke-width="2" opacity="0.45"/>
    </pattern>
    <pattern id="bark" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="none"/>
      <path d="M15 0 L25 120" stroke="#2b150a" stroke-width="6" opacity="0.4"/>
      <path d="M60 0 L50 120" stroke="#3a1e0f" stroke-width="4" opacity="0.35"/>
      <path d="M95 0 L110 120" stroke="#241108" stroke-width="5" opacity="0.35"/>
      <path d="M30 30 C45 20, 65 20, 80 30" stroke="#241108" stroke-width="3" opacity="0.4" fill="none"/>
      <path d="M25 80 C45 70, 70 70, 90 82" stroke="#2c150a" stroke-width="3" opacity="0.4" fill="none"/>
    </pattern>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f1f10"/>
      <stop offset="1" stop-color="#e6c39a"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.2" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#fff7e6" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
