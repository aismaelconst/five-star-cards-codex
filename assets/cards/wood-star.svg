  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#bg)"/>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#wood)" opacity="0.8"/>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#bark)" opacity="0.55"/>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#rings)" opacity="0.5"/>
  <rect x="28" y="28" width="544" height="744" rx="24" fill="none" stroke="url(#frame)" stroke-width="6"/>
  <rect x="45" y="45" width="510" height="710" rx="20" fill="none" stroke="#4a2a18" stroke-width="2" opacity="0.75"/>
  <g transform="translate(300 360)">
    <polygon points="0,-150 40,-45 150,-35 60,35 90,145 0,85 -90,145 -60,35 -150,-35 -40,-45" fill="#efc48f" stroke="#4a2a18" stroke-width="6"/>
    <path d="M-70 -10 C-20 -40, 20 -40, 70 -10" fill="none" stroke="#6a3a1f" stroke-width="7"/>
    <path d="M-85 35 C-25 10, 25 10, 85 35" fill="none" stroke="#5a321b" stroke-width="7"/>
  </g>
  <rect x="130" y="640" width="340" height="70" rx="16" fill="#1c0d07" opacity="0.55"/>
  <text x="300" y="690" text-anchor="middle" font-family="'Times New Roman', serif" font-size="48" fill="#f5dcc0" letter-spacing="6">WOOD</text>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#shine)"/>
