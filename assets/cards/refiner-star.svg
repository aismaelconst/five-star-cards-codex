<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#effbff"/>
      <stop offset="0.55" stop-color="#a5c2d1"/>
      <stop offset="1" stop-color="#4a6472"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="2" seed="37"/>
      <feColorMatrix type="saturate" values="0.12"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.45"/>
      </feComponentTransfer>
    </filter>
    <pattern id="polish" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M14 28 L106 28" stroke="#d5e7ef" stroke-width="3" opacity="0.2"/>
      <path d="M24 60 L96 60" stroke="#c2d8e2" stroke-width="3" opacity="0.18"/>
      <path d="M34 92 L86 92" stroke="#a8c2cf" stroke-width="3" opacity="0.16"/>
    </pattern>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#496271"/>
      <stop offset="1" stop-color="#e5f4fb"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.2" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#bg)"/>
  <rect x="10" y="10" width="580" height="780" rx="30" filter="url(#grain)" opacity="0.58"/>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#polish)" opacity="0.62"/>
  <rect x="28" y="28" width="544" height="744" rx="24" fill="none" stroke="url(#frame)" stroke-width="6"/>
  <rect x="45" y="45" width="510" height="710" rx="20" fill="none" stroke="#48606d" stroke-width="2" opacity="0.75"/>
  <g transform="translate(300 360)">
    <polygon points="0,-150 40,-45 150,-35 60,35 90,145 0,85 -90,145 -60,35 -150,-35 -40,-45" fill="#eef9ff" stroke="#496271" stroke-width="6"/>
    <polygon points="0,-102 34,-26 102,-16 44,24 66,96 0,58 -66,96 -44,24 -102,-16 -34,-26" fill="#9ab9c9" opacity="0.94"/>
    <path d="M0 -74 L40 -6 L0 60 L-40 -6 Z" fill="#f4fbff" opacity="0.9"/>
    <path d="M0 -54 L24 -6 L0 40 L-24 -6 Z" fill="#d9ebf4" opacity="0.9"/>
  </g>
  <rect x="120" y="640" width="360" height="70" rx="16" fill="#1f2b31" opacity="0.66"/>
  <text x="300" y="689" text-anchor="middle" font-family="'Times New Roman', serif" font-size="48" fill="#eef9ff" letter-spacing="6">REFINER</text>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#shine)"/>
