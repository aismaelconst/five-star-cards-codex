<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe2cc"/>
      <stop offset="0.55" stop-color="#c04b24"/>
      <stop offset="1" stop-color="#5b1d0c"/>
    </linearGradient>
    <pattern id="facet" width="140" height="140" patternUnits="userSpaceOnUse">
      <polygon points="0,0 70,0 30,50" fill="#ffb28a" opacity="0.7"/>
      <polygon points="70,0 140,0 110,60" fill="#e46a3c" opacity="0.55"/>
