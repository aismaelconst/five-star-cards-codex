<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7f6ff"/>
      <stop offset="0.55" stop-color="#6db6d6"/>
      <stop offset="1" stop-color="#2b6f95"/>
    </linearGradient>
    <filter id="grit" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.55"/>
      </feComponentTransfer>
    </filter>
    <pattern id="scrape" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M10 10 L110 40" stroke="#2a4a5f" stroke-width="2" opacity="0.28"/>
      <path d="M0 70 L120 95" stroke="#1f3a4b" stroke-width="2" opacity="0.22"/>
    </pattern>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f5d78"/>
      <stop offset="1" stop-color="#dff2ff"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.18" cy="0.08" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#bg)"/>
  <rect x="10" y="10" width="580" height="780" rx="30" filter="url(#grit)" opacity="0.6"/>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#scrape)" opacity="0.5"/>
  <rect x="28" y="28" width="544" height="744" rx="24" fill="none" stroke="url(#frame)" stroke-width="6"/>
  <rect x="45" y="45" width="510" height="710" rx="20" fill="none" stroke="#2c536b" stroke-width="2" opacity="0.75"/>
  <g transform="translate(300 360)">
    <polygon points="0,-150 40,-45 150,-35 60,35 90,145 0,85 -90,145 -60,35 -150,-35 -40,-45" fill="#e8f7ff" stroke="#2d5f7b" stroke-width="6"/>
    <polygon points="0,-95 35,-20 95,-10 40,25 60,90 0,55 -60,90 -40,25 -95,-10 -35,-20" fill="#6faecb" opacity="0.95"/>
  </g>
  <rect x="95" y="640" width="410" height="70" rx="16" fill="#1e2329" opacity="0.6"/>
  <text x="300" y="690" text-anchor="middle" font-family="'Times New Roman', serif" font-size="48" fill="#e6f7ff" letter-spacing="6">PLATINUM</text>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#shine)"/>
</svg>
