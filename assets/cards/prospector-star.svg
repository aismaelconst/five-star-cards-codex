  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#ore)" opacity="0.62"/>
  <rect x="28" y="28" width="544" height="744" rx="24" fill="none" stroke="url(#frame)" stroke-width="6"/>
  <rect x="45" y="45" width="510" height="710" rx="20" fill="none" stroke="#79571d" stroke-width="2" opacity="0.75"/>
