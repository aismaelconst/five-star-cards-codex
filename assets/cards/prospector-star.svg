      <stop offset="1" stop-color="#6d4f21"/>
    </linearGradient>
    <filter id="grit" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="23"/>
      <feColorMatrix type="saturate" values="0.35"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.55"/>
      </feComponentTransfer>
    </filter>
    <pattern id="ore" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="22" cy="26" r="10" fill="#f1cf88" opacity="0.18"/>
      <circle cx="86" cy="44" r="8" fill="#e7bd65" opacity="0.16"/>
      <path d="M12 88 L108 28" stroke="#5e431a" stroke-width="3" opacity="0.18"/>
      <path d="M22 20 L42 44" stroke="#8c6a30" stroke-width="3" opacity="0.22"/>
