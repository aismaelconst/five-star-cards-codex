<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2fbff"/>
      <stop offset="0.5" stop-color="#95aec4"/>
      <stop offset="1" stop-color="#4c6274"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="2" seed="19"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.42"/>
      </feComponentTransfer>
    </filter>
    <pattern id="mintBands" width="72" height="72" patternUnits="userSpaceOnUse">
      <rect width="72" height="72" fill="none"/>
      <path d="M6 0 L24 72" stroke="#d7e7f4" stroke-width="8" opacity="0.24"/>
      <path d="M42 0 L60 72" stroke="#bdd3e6" stroke-width="6" opacity="0.22"/>
      <circle cx="18" cy="20" r="4" fill="#e8f2fb" opacity="0.32"/>
      <circle cx="54" cy="52" r="4" fill="#d5e4f1" opacity="0.3"/>
    </pattern>
    <pattern id="engrave" width="110" height="110" patternUnits="userSpaceOnUse">
