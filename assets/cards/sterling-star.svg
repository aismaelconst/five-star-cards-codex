      <stop offset="0.75" stop-color="#b6c9da"/>
      <stop offset="1" stop-color="#748aa1"/>
    </radialGradient>
    <radialGradient id="shine" cx="0.2" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#bg)"/>
  <rect x="10" y="10" width="580" height="780" rx="30" filter="url(#grain)" opacity="0.62"/>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#engrave)" opacity="0.55"/>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#mintBands)" opacity="0.58"/>
  <rect x="28" y="28" width="544" height="744" rx="24" fill="none" stroke="url(#frame)" stroke-width="8"/>
  <rect x="44" y="44" width="512" height="712" rx="20" fill="none" stroke="#3f4f5f" stroke-width="3" opacity="0.82"/>
