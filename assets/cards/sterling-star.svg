  <rect x="82" y="636" width="436" height="76" rx="16" fill="#1f2a33" opacity="0.72"/>
  <text x="300" y="689" text-anchor="middle" font-family="'Times New Roman', serif" font-size="48" fill="#f0f7ff" letter-spacing="6">STERLING</text>
