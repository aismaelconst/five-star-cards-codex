<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fcff"/>
      <stop offset="0.55" stop-color="#b5c3d3"/>
      <stop offset="1" stop-color="#6d7f90"/>
    </linearGradient>
    <filter id="grit" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.5"/>
      </feComponentTransfer>
    </filter>
    <pattern id="scrape" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M10 18 L110 46" stroke="#4e5966" stroke-width="2" opacity="0.28"/>
      <path d="M0 78 L120 104" stroke="#3f4752" stroke-width="2" opacity="0.24"/>
    </pattern>
    <pattern id="gloss" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="90" height="90" fill="none"/>
      <path d="M15 0 L35 90" stroke="#dbe4ee" stroke-width="6" opacity="0.25"/>
      <path d="M55 0 L75 90" stroke="#c8d3df" stroke-width="4" opacity="0.22"/>
    </pattern>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f6b78"/>
      <stop offset="1" stop-color="#d8e1ec"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.2" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#bg)"/>
  <rect x="10" y="10" width="580" height="780" rx="30" filter="url(#grit)" opacity="0.6"/>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#scrape)" opacity="0.55"/>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#gloss)" opacity="0.45"/>
  <rect x="28" y="28" width="544" height="744" rx="24" fill="none" stroke="url(#frame)" stroke-width="6"/>
  <rect x="45" y="45" width="510" height="710" rx="20" fill="none" stroke="#4f5a66" stroke-width="2" opacity="0.75"/>
  <g transform="translate(300 365)">
    <polygon points="0,-150 40,-45 150,-35 60,35 90,145 0,85 -90,145 -60,35 -150,-35 -40,-45" fill="#f0f5fb" stroke="#5c6a78" stroke-width="6"/>
    <polygon points="0,-110 30,-35 110,-25 45,25 70,105 0,60 -70,105 -45,25 -110,-25 -30,-35" fill="#9aa8b8" opacity="0.9"/>
  </g>
  <rect x="95" y="640" width="410" height="70" rx="16" fill="#1f242a" opacity="0.65"/>
  <text x="300" y="690" text-anchor="middle" font-family="'Times New Roman', serif" font-size="48" fill="#f2f7fd" letter-spacing="6">STERLING</text>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#shine)"/>
</svg>
