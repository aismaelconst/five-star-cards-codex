      <path d="M6 88 L106 96" stroke="#3c4c5c" stroke-width="2" opacity="0.2"/>
    </pattern>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#40586d"/>
      <stop offset="1" stop-color="#d8e7f3"/>
