<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd8cf"/>
      <stop offset="0.55" stop-color="#d18a79"/>
      <stop offset="1" stop-color="#7a3f3a"/>
    </linearGradient>
    <filter id="grit" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="15"/>
      <feColorMatrix type="saturate" values="0.4"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.55"/>
      </feComponentTransfer>
    </filter>
    <pattern id="stamp" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="none"/>
      <path d="M10 10 L110 10" stroke="#7a3f3a" stroke-width="2" opacity="0.25"/>
      <path d="M10 110 L110 110" stroke="#7a3f3a" stroke-width="2" opacity="0.25"/>
      <path d="M10 10 L10 110" stroke="#7a3f3a" stroke-width="2" opacity="0.25"/>
      <path d="M110 10 L110 110" stroke="#7a3f3a" stroke-width="2" opacity="0.25"/>
      <circle cx="60" cy="60" r="16" fill="#c77b6c" opacity="0.25"/>
    </pattern>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b4a45"/>
      <stop offset="1" stop-color="#f3c6bd"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.2" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#fff5f1" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#bg)"/>
  <rect x="10" y="10" width="580" height="780" rx="30" filter="url(#grit)" opacity="0.6"/>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#stamp)" opacity="0.55"/>
  <rect x="28" y="28" width="544" height="744" rx="24" fill="none" stroke="url(#frame)" stroke-width="6"/>
  <rect x="45" y="45" width="510" height="710" rx="20" fill="none" stroke="#8b4a45" stroke-width="2" opacity="0.75"/>
  <g transform="translate(300 365)">
    <polygon points="0,-150 40,-45 150,-35 60,35 90,145 0,85 -90,145 -60,35 -150,-35 -40,-45" fill="#ffe4de" stroke="#8b4a45" stroke-width="6"/>
    <polygon points="0,-110 30,-35 110,-25 45,25 70,105 0,60 -70,105 -45,25 -110,-25 -30,-35" fill="#d28377" opacity="0.9"/>
  </g>
  <rect x="105" y="640" width="390" height="70" rx="16" fill="#2b1917" opacity="0.65"/>
  <text x="300" y="690" text-anchor="middle" font-family="'Times New Roman', serif" font-size="48" fill="#ffeae4" letter-spacing="6">HALLMARK</text>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#shine)"/>
</svg>
