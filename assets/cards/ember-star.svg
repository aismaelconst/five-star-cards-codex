<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1e8"/>
      <stop offset="0.55" stop-color="#d27a56"/>
      <stop offset="1" stop-color="#7b2f1d"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="27"/>
      <feColorMatrix type="saturate" values="0.2"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.4"/>
      </feComponentTransfer>
    </filter>
    <pattern id="embers" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="20" r="4" fill="#ffd8bf" opacity="0.32"/>
      <circle cx="68" cy="44" r="5" fill="#ffb98e" opacity="0.28"/>
      <circle cx="40" cy="84" r="4" fill="#ffd3b6" opacity="0.26"/>
      <path d="M6 72 L94 26" stroke="#5b2518" stroke-width="2" opacity="0.18"/>
    </pattern>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a2e1d"/>
      <stop offset="1" stop-color="#f0b18f"/>
    </linearGradient>
    <radialGradient id="core" cx="0.25" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#fff5e8"/>
      <stop offset="0.7" stop-color="#f5ab7d"/>
      <stop offset="1" stop-color="#b34d31"/>
    </radialGradient>
    <radialGradient id="shine" cx="0.2" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#bg)"/>
  <rect x="10" y="10" width="580" height="780" rx="30" filter="url(#grain)" opacity="0.6"/>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#embers)" opacity="0.6"/>
  <rect x="28" y="28" width="544" height="744" rx="24" fill="none" stroke="url(#frame)" stroke-width="6"/>
  <rect x="45" y="45" width="510" height="710" rx="20" fill="none" stroke="#7a3020" stroke-width="2" opacity="0.78"/>
  <g transform="translate(300 365)">
    <polygon points="0,-150 40,-45 150,-35 60,35 90,145 0,85 -90,145 -60,35 -150,-35 -40,-45" fill="url(#core)" stroke="#7a2e1d" stroke-width="6"/>
    <polygon points="0,-110 30,-35 110,-25 45,25 70,105 0,60 -70,105 -45,25 -110,-25 -30,-35" fill="#d96f48" opacity="0.9"/>
  </g>
  <rect x="118" y="640" width="364" height="70" rx="16" fill="#35160f" opacity="0.67"/>
  <text x="300" y="690" text-anchor="middle" font-family="'Times New Roman', serif" font-size="48" fill="#fff2e8" letter-spacing="6">EMBER</text>
  <rect x="10" y="10" width="580" height="780" rx="30" fill="url(#shine)"/>
</svg>
